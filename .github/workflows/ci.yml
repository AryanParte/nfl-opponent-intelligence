name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Reproducible synthetic demo
        run: >-
          python -m opponent_intelligence
          --csv tests/fixtures/synthetic_pbp.csv
          --source-label 'Synthetic CI fixture; not real NFL observations'
          --team CAR --season 2024 --before-week 3

  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional API and test dependencies
        run: python -m pip install -c requirements/api-constraints.txt '.[api,test-api]'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Offline API contracts with synthetic snapshots
        run: python -m unittest discover -s tests_api -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Offline frontend contracts and interaction tests
        run: npm test
      - name: Type-check and build local report view
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install optional API and test dependencies
        run: python -m pip install -c requirements/api-constraints.txt '.[api,test-api]'
      - name: Install locked browser test dependencies
        working-directory: web
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Real API to browser to offline brief, synthetic data only
        working-directory: web
        run: npm run test:e2e
      - name: Preserve synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-failure
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
