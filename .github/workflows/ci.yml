name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Reproducible synthetic demo
        run: >-
          python -m opponent_intelligence
          --csv tests/fixtures/synthetic_pbp.csv
          --source-label 'Synthetic CI fixture; not real NFL observations'
          --team CAR --season 2024 --before-week 3
