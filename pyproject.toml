[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-opponent-intelligence"
version = "0.1.0"
description = "Reproducible opponent tendency reports from NFL play-by-play data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opponent-intelligence = "opponent_intelligence.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
