[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-opponent-intelligence"
version = "0.1.0"
description = "Reproducible opponent tendency reports from NFL play-by-play data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.143.0", "pydantic==2.14.0", "uvicorn==0.54.0"]
test-api = ["httpx2==2.13.1"]

[project.scripts]
opponent-intelligence = "opponent_intelligence.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
